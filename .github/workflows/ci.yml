name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secrets Audit
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Scan for exposed credentials
        run: |
          ! git grep -i -E "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" -- ':!tmp'
          ! git grep -i -E "password[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" -- ':!tmp' ':!tests'
          echo "Clean."

  cpp:
    name: C++ Build & Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12 & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: ./build/benchmark_runner

  dashboard:
    name: Dashboard (Lint / Test / Build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dibyt-dashboard/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/dibyt-dashboard ci

      - name: Lint
        run: npm --prefix apps/dibyt-dashboard run lint

      - name: Test
        run: npm --prefix apps/dibyt-dashboard run test

      - name: Build
        run: npm --prefix apps/dibyt-dashboard run build

  containers:
    name: Docker Builds
    runs-on: ubuntu-22.04
    needs: [audit, cpp, dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dibyt-server:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: false
          tags: dibyt-dashboard:ci

  release:
    name: Release (tags only)
    runs-on: ubuntu-22.04
    needs: [containers]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12 & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Build release binaries
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=OFF
          cmake --build build --target dibyt-server dibyt-cli

      - name: Package & checksum
        run: |
          mkdir -p release-dist/bin
          cp build/apps/dibyt-server/dibyt-server release-dist/bin/
          cp build/apps/dibyt-cli/dibyt release-dist/bin/
          cp LICENSE NOTICE README.md release-dist/
          ARCH=$(uname -m)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="dibyt-${TAG_NAME}-linux-${ARCH}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C release-dist .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
