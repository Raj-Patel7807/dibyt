name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Code Hygiene & Secrets Audit
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify No Staged or Committed Secrets
        run: |
          echo "Scanning tree for accidental secret patterns..."
          ! git grep -i -E "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" -- ':!tmp'
          ! git grep -i -E "password[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" -- ':!tmp' ':!tests'
          echo "Secret check passed."

  build-and-test-cpp:
    name: C++20 Build & Test Suite (GCC 12)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=ON

      - name: Build All Targets
        run: |
          cmake --build build

      - name: Run Full Test Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure

      - name: Execute Benchmark Harness Verification
        run: |
          ./build/benchmark_runner

  build-and-test-dashboard:
    name: Dashboard Web Console Check (TypeScript & Vite)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dibyt-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd apps/dibyt-dashboard
          npm ci

      - name: Typecheck and Build Dashboard
        run: |
          cd apps/dibyt-dashboard
          npm run build

  container-build:
    name: Container Build & Validation
    runs-on: ubuntu-22.04
    needs: [build-and-test-cpp, build-and-test-dashboard]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          push: false
          tags: dibyt-server:ci-test

      - name: Build Dashboard Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: false
          tags: dibyt-dashboard:ci-test

  package-release:
    name: Production Release Packaging & Checksums
    runs-on: ubuntu-22.04
    needs: [build-and-test-cpp, build-and-test-dashboard, container-build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Build Optimized Release Binaries
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=OFF
          cmake --build build --target dibyt-server dibyt-cli

      - name: Package Distribution Archive with Checksums
        run: |
          mkdir -p release-dist/bin
          cp build/apps/dibyt-server/dibyt-server release-dist/bin/
          cp build/apps/dibyt-cli/dibyt release-dist/bin/
          cp LICENSE NOTICE README.md release-dist/
          ARCH=$(uname -m)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="dibyt-${TAG_NAME}-linux-${ARCH}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C release-dist .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
