name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-audit:
    name: Code Hygiene & Secrets Audit
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository for accidentally exposed credentials
        run: |
          echo "Scanning tracked files for private keys or hardcoded credentials..."
          ! git grep -i -E "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" -- ':!tmp'
          ! git grep -i -E "password[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" -- ':!tmp' ':!tests'
          echo "Secrets audit clean."

  cpp-build-and-test:
    name: C++20 Core Build & Test Suite
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools and GCC 12 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure CMake with strict compiler diagnostics
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=ON

      - name: Compile all libraries, CLI, server, and test targets
        run: |
          cmake --build build

      - name: Execute CTest regression suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Execute reproducible throughput benchmark runner
        run: |
          ./build/benchmark_runner

  dashboard-quality-gate:
    name: Web Dashboard Quality Gate
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dibyt-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: |
          npm --prefix apps/dibyt-dashboard ci

      - name: Run ESLint code quality checks
        run: |
          npm --prefix apps/dibyt-dashboard run lint

      - name: Run Vitest unit tests
        run: |
          npm --prefix apps/dibyt-dashboard run test

      - name: Verify TypeScript types and build production bundle
        run: |
          npm --prefix apps/dibyt-dashboard run build

  container-build:
    name: Container Build & Packaging Validation
    runs-on: ubuntu-22.04
    # Runs when code hygiene, C++ suite, and Web dashboard quality gates pass
    needs: [code-audit, cpp-build-and-test, dashboard-quality-gate]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server multi-stage container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dibyt-server:ci-test

      - name: Build dashboard unprivileged container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: false
          tags: dibyt-dashboard:ci-test

  release-publish:
    name: Release Packaging & Checksums
    runs-on: ubuntu-22.04
    needs: [container-build]
    # Release assets are published strictly when a version tag (e.g. v0.1.0) is pushed
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Build clean distribution binaries
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=OFF
          cmake --build build --target dibyt-server dibyt-cli

      - name: Package tarball and generate SHA-256 checksums
        run: |
          mkdir -p release-dist/bin
          cp build/apps/dibyt-server/dibyt-server release-dist/bin/
          cp build/apps/dibyt-cli/dibyt release-dist/bin/
          cp LICENSE NOTICE README.md release-dist/
          ARCH=$(uname -m)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="dibyt-${TAG_NAME}-linux-${ARCH}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C release-dist .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Publish artifacts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
