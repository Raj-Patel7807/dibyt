name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test (Linux GCC C++20)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12

      - name: Build All Targets
        run: |
          cmake --build build

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure

  package-release:
    name: Package Release Artifacts & Checksums
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Build Release Binaries
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDIBYT_BUILD_TESTS=OFF \
            -DDIBYT_BUILD_BENCHMARKS=OFF
          cmake --build build --target dibyt-server dibyt-cli

      - name: Create Tarball and Generate Checksums
        run: |
          mkdir -p release-dist/bin
          cp build/apps/dibyt-server/dibyt-server release-dist/bin/
          cp build/apps/dibyt-cli/dibyt-cli release-dist/bin/
          cp LICENSE NOTICE README.md release-dist/
          ARCH=$(uname -m)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="dibyt-${TAG_NAME}-linux-${ARCH}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C release-dist .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          push: false
          tags: dibyt-server:test

      - name: Build Dashboard Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: false
          tags: dibyt-dashboard:test
